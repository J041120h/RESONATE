# RESONATE conda environment (CPU), validated 2026-11-05: the full test suite and the README quick start pass with
# exactly these versions (Python 3.11, CPU-only PyTorch).
#
#   conda env create -f environment.yml
#   conda activate resonate
#   pip install -e . --no-deps          # from the clone: add the resonate package itself
#
# GPU (NVIDIA): replace the two PyTorch lines below by a CUDA build that matches your driver, for example the build
# used for the GPU validation of the package:
#       - --extra-index-url https://download.pytorch.org/whl/cu124
#       - torch==2.5.1+cu124
# (see https://pytorch.org/get-started/locally/ for newer CUDA builds). Nothing else changes.
name: resonate
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch==2.15.0+cpu
      - numpy==1.26.4
      - scipy==1.17.1
      - pandas==2.3.3
      - scikit-learn==1.9.1
      - anndata==0.12.19
      - scanpy==1.11.5
      - pynndescent==0.6.0
      - harmonypy==2.1.0
      - igraph==1.0.0
      - leidenalg==0.12.0
      - pytest==9.2.0
