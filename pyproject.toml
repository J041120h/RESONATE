[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "resonate-st"                      # `resonate` is taken on PyPI (a different project); the import name is `resonate`
version = "0.2.0"
description = "RESONATE: predict genes never measured in a spatial transcriptomics panel from a matched single-cell reference and gene embeddings"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Harry Jiang", email = "hjiang55@jh.edu" },
  { name = "Hongkai Ji" },
  { name = "Uthsav Chitra" },
]
keywords = ["spatial transcriptomics", "gene imputation", "single-cell", "foundation models", "deep learning"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24,<2",
  "scipy>=1.10",
  "pandas>=1.5",
  "scikit-learn>=1.2",
  "torch>=2.1",
  "anndata>=0.10",
  "scanpy>=1.10,<1.12",
  "pynndescent<0.7",             # 0.7 returns scipy sparse arrays that scanpy 1.11 cannot read
  "harmonypy>=0.0.9",
  "igraph>=0.10",
  "leidenalg>=0.10",
]

[project.optional-dependencies]
test = ["pytest", "matplotlib"]
notebook = ["jupyter", "ipykernel", "matplotlib"]   # to run the tutorial notebook

[project.scripts]
resonate = "resonate.cli:main"

[project.urls]
Homepage = "https://github.com/J041120h/RESONATE"
Documentation = "https://j041120h.github.io/RESONATE_tutorial/"
Repository = "https://github.com/J041120h/RESONATE"
Issues = "https://github.com/J041120h/RESONATE/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests (minutes on CPU)", "gpu: needs CUDA"]
