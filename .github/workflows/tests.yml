name: tests
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: { python-version: ["3.10", "3.11"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: python -m pip install --upgrade pip
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu     # CPU-only build; the GPU test is skipped
      - run: pip install -e ".[test]"
      - run: pytest -q                                                               # unit + end-to-end tests on the CPU
      - run: sha256sum -c SHA256SUMS
        working-directory: sample_data
